name: Reproduce Markdown open on Android

on:
  push:
    branches:
      - diagnostics-current-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Android API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 35]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - uses: android-actions/setup-android@v3

      - name: Install compile SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch emulator and open the regression document
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: Nexus 5X
          ram-size: 2048M
          heap-size: 256M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p runtime-artifact
            adb logcat -c
            status=0
            gradle --no-daemon --stacktrace connectedDebugAndroidTest || status=$?
            adb logcat -d -v threadtime > runtime-artifact/logcat-api-${{ matrix.api-level }}.txt || true
            adb shell dumpsys meminfo dev.mdview.app > runtime-artifact/meminfo-api-${{ matrix.api-level }}.txt || true
            adb shell dumpsys activity activities > runtime-artifact/activities-api-${{ matrix.api-level }}.txt || true
            adb exec-out screencap -p > runtime-artifact/screenshot-api-${{ matrix.api-level }}.png || true
            exit "$status"

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-api-${{ matrix.api-level }}
          path: runtime-artifact/
          if-no-files-found: warn
