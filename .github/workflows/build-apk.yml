name: Build and publish MD View APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - word-wrap-direct-apk-v1.0.4

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MD_VIEW_SIGNING_SECRET: ${{ secrets.MD_VIEW_SIGNING_SECRET }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read application version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -n 1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Require persistent signing secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MD_VIEW_SIGNING_SECRET:-}" ]; then
            echo "Repository secret MD_VIEW_SIGNING_SECRET is missing." >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Test, lint, and build release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean testReleaseUnitTest lintRelease assembleRelease

          unzip -p app/build/outputs/apk/release/app-release-unsigned.apk 'classes*.dex' \
            | strings > "$RUNNER_TEMP/dex-strings.txt"
          DESUGARED_COUNT="$(grep -c 'Lj\$/util/function/' "$RUNNER_TEMP/dex-strings.txt" || true)"
          test "$DESUGARED_COUNT" -gt 0

      - name: Restore and verify persistent release key
        id: release_key
        shell: bash
        run: |
          set -euo pipefail
          ENCRYPTED_KEY="$RUNNER_TEMP/mdview-release.p12.enc"
          RELEASE_KEY="$RUNNER_TEMP/mdview-release.p12"
          RELEASE_CERT="$RUNNER_TEMP/mdview-release-certificate.der"

          tr -d '\r\n' < release-signing/mdview-release.p12.enc.b64 \
            | base64 --decode > "$ENCRYPTED_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 \
            -in "$ENCRYPTED_KEY" \
            -out "$RELEASE_KEY" \
            -pass env:MD_VIEW_SIGNING_SECRET
          chmod 600 "$RELEASE_KEY"

          keytool -list \
            -keystore "$RELEASE_KEY" \
            -storetype PKCS12 \
            -storepass "$MD_VIEW_SIGNING_SECRET" \
            -alias mdview-release >/dev/null
          keytool -exportcert \
            -keystore "$RELEASE_KEY" \
            -storetype PKCS12 \
            -storepass "$MD_VIEW_SIGNING_SECRET" \
            -alias mdview-release \
            -file "$RELEASE_CERT" >/dev/null

          EXPECTED_CERT_SHA256="$(tr -d '[:space:]' < release-signing/certificate.sha256)"
          ACTUAL_CERT_SHA256="$(sha256sum "$RELEASE_CERT" | awk '{print $1}')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

          echo "path=$RELEASE_KEY" >> "$GITHUB_OUTPUT"
          echo "certificate_sha256=$ACTUAL_CERT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Sign and verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="$RUNNER_TEMP/app-release-aligned.apk"
          OUTPUT_DIR="$GITHUB_WORKSPACE/release-output"
          OUTPUT_APK="$OUTPUT_DIR/MD-View-v${{ steps.version.outputs.name }}.apk"

          mkdir -p "$OUTPUT_DIR"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "${{ steps.release_key.outputs.path }}" \
            --ks-type PKCS12 \
            --ks-key-alias mdview-release \
            --ks-pass env:MD_VIEW_SIGNING_SECRET \
            --key-pass env:MD_VIEW_SIGNING_SECRET \
            --min-sdk-version 23 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUTPUT_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUTPUT_APK" \
            | tee "$OUTPUT_DIR/signature-verification.txt"
          "$BUILD_TOOLS/zipalign" -c -p 4 "$OUTPUT_APK"
          "$BUILD_TOOLS/aapt" dump badging "$OUTPUT_APK" \
            | tee "$OUTPUT_DIR/apk-badging.txt"

          APK_SHA256="$(sha256sum "$OUTPUT_APK" | awk '{print $1}')"
          printf '%s  %s\n' "$APK_SHA256" "$(basename "$OUTPUT_APK")" \
            > "$OUTPUT_DIR/SHA256SUMS.txt"
          echo "path=$OUTPUT_APK" >> "$GITHUB_OUTPUT"
          echo "sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"

      - name: Publish direct APK download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          APK="${{ steps.apk.outputs.path }}"
          CHECKSUMS="$GITHUB_WORKSPACE/release-output/SHA256SUMS.txt"
          NOTES="$RUNNER_TEMP/release-notes.md"

          cat > "$NOTES" <<EOF
          ## MD View ${{ steps.version.outputs.name }}

          - Android 6.0 or newer
          - Persistent update-compatible signature
          - Raw Markdown word-wrap toggle
          - Direct APK download; no ZIP extraction required

          APK SHA-256: `${{ steps.apk.outputs.sha256 }}`
          Signing certificate SHA-256: `${{ steps.release_key.outputs.certificate_sha256 }}`
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "MD View ${{ steps.version.outputs.name }}" \
              --notes-file "$NOTES"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MD View ${{ steps.version.outputs.name }}" \
              --notes-file "$NOTES"
          fi

          gh release upload "$TAG" \
            "$APK" \
            "$CHECKSUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          DIRECT_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$APK")"
          {
            echo "## Direct APK"
            echo
            echo "[$(basename "$APK")]($DIRECT_URL)"
            echo
            echo "SHA-256: `${{ steps.apk.outputs.sha256 }}`"
          } >> "$GITHUB_STEP_SUMMARY"
