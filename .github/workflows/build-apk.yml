name: Build installable MD View APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Test, lint, and build release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean testReleaseUnitTest lintRelease assembleRelease

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="app/build/outputs/apk/release/app-release-aligned.apk"
          OUTPUT_DIR="artifact"
          OUTPUT_APK="$OUTPUT_DIR/MD-View-v1.0.1.apk"
          STORE_PASSWORD="mdview-build-2026"

          test -f "$UNSIGNED_APK"
          mkdir -p "$OUTPUT_DIR"

          # Replace this generated key with a persistent release key for upgradeable releases.
          keytool -genkeypair -noprompt \
            -keystore mdview-release.jks \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -alias mdview \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10000 \
            -dname "CN=MD View, O=Local Build, L=Berlin, C=DE"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks mdview-release.jks \
            --ks-key-alias mdview \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$STORE_PASSWORD" \
            --min-sdk-version 23 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUTPUT_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUTPUT_APK" \
            | tee "$OUTPUT_DIR/signature-verification.txt"
          "$BUILD_TOOLS/aapt" dump badging "$OUTPUT_APK" \
            | tee "$OUTPUT_DIR/apk-badging.txt"
          sha256sum "$OUTPUT_APK" | tee "$OUTPUT_DIR/SHA256SUMS.txt"
          git archive --format=zip --output="$OUTPUT_DIR/MD-View-source-v1.0.1.zip" HEAD
          {
            echo "MD View 1.0.1"
            echo "Commit: $GITHUB_SHA"
            echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Minimum Android: 6.0 (API 23)"
            echo "Target Android API: 34"
            echo "Compile Android API: 36"
            echo "Signing: one-build self-signed certificate"
          } > "$OUTPUT_DIR/build-info.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MD-View-v1.0.1
          path: artifact/
          if-no-files-found: error
