name: Build installable MD View APK

on:
  workflow_dispatch:
    inputs:
      require_signed_apk:
        description: Fail the manual run when the signing secret is not configured
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main
      - raw-webview-persistent-signing-v1.0.3

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MD_VIEW_SIGNING_SECRET: ${{ secrets.MD_VIEW_SIGNING_SECRET }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read application version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -n 1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Detect persistent signing configuration
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${MD_VIEW_SIGNING_SECRET:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Persistent signing secret is configured."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Persistent signing secret is not configured; only the unsigned CI artifact will be produced."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Test, lint, and build release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean testReleaseUnitTest lintRelease assembleRelease
          mkdir -p artifact-unsigned
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
            "artifact-unsigned/MD-View-v${{ steps.version.outputs.name }}-unsigned.apk"
          unzip -p app/build/outputs/apk/release/app-release-unsigned.apk 'classes*.dex' \
            | strings > artifact-unsigned/dex-strings.txt
          DESUGARED_COUNT="$(grep -c 'Lj\$/util/function/' artifact-unsigned/dex-strings.txt || true)"
          DIRECT_COUNT="$(grep -c 'Ljava/util/function/' artifact-unsigned/dex-strings.txt || true)"
          {
            echo "Version name: ${{ steps.version.outputs.name }}"
            echo "Version code: ${{ steps.version.outputs.code }}"
            echo "Desugared j$/util/function descriptors: $DESUGARED_COUNT"
            echo "Direct java/util/function descriptors: $DIRECT_COUNT"
            echo "Authoritative API 23 check: Android 6 runtime smoke workflow."
          } > artifact-unsigned/build-info.txt
          test "$DESUGARED_COUNT" -gt 0

      - name: Restore and verify persistent release key
        if: steps.signing.outputs.available == 'true'
        id: release_key
        shell: bash
        run: |
          set -euo pipefail
          ENCRYPTED_KEY="$RUNNER_TEMP/mdview-release.p12.enc"
          RELEASE_KEY="$RUNNER_TEMP/mdview-release.p12"
          RELEASE_CERT="$RUNNER_TEMP/mdview-release-certificate.der"

          tr -d '\r\n' < release-signing/mdview-release.p12.enc.b64 \
            | base64 --decode > "$ENCRYPTED_KEY"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 \
            -in "$ENCRYPTED_KEY" \
            -out "$RELEASE_KEY" \
            -pass env:MD_VIEW_SIGNING_SECRET
          chmod 600 "$RELEASE_KEY"

          keytool -list \
            -keystore "$RELEASE_KEY" \
            -storetype PKCS12 \
            -storepass "$MD_VIEW_SIGNING_SECRET" \
            -alias mdview-release >/dev/null
          keytool -exportcert \
            -keystore "$RELEASE_KEY" \
            -storetype PKCS12 \
            -storepass "$MD_VIEW_SIGNING_SECRET" \
            -alias mdview-release \
            -file "$RELEASE_CERT" >/dev/null

          EXPECTED_CERT_SHA256="$(tr -d '[:space:]' < release-signing/certificate.sha256)"
          ACTUAL_CERT_SHA256="$(sha256sum "$RELEASE_CERT" | awk '{print $1}')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

          echo "path=$RELEASE_KEY" >> "$GITHUB_OUTPUT"
          echo "certificate_sha256=$ACTUAL_CERT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Sign, verify, and package release APK
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="$RUNNER_TEMP/app-release-aligned.apk"
          OUTPUT_DIR="artifact-signed"
          OUTPUT_APK="$OUTPUT_DIR/MD-View-v${{ steps.version.outputs.name }}.apk"

          mkdir -p "$OUTPUT_DIR"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "${{ steps.release_key.outputs.path }}" \
            --ks-type PKCS12 \
            --ks-key-alias mdview-release \
            --ks-pass env:MD_VIEW_SIGNING_SECRET \
            --key-pass env:MD_VIEW_SIGNING_SECRET \
            --min-sdk-version 23 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUTPUT_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUTPUT_APK" \
            | tee "$OUTPUT_DIR/signature-verification.txt"
          "$BUILD_TOOLS/zipalign" -c -p 4 "$OUTPUT_APK"
          "$BUILD_TOOLS/aapt" dump badging "$OUTPUT_APK" \
            | tee "$OUTPUT_DIR/apk-badging.txt"
          sha256sum "$OUTPUT_APK" | tee "$OUTPUT_DIR/SHA256SUMS.txt"
          cp release-signing/certificate.pem "$OUTPUT_DIR/release-certificate.pem"
          printf '%s\n' "${{ steps.release_key.outputs.certificate_sha256 }}" \
            > "$OUTPUT_DIR/release-certificate.sha256"
          git archive --format=zip \
            --output="$OUTPUT_DIR/MD-View-source-v${{ steps.version.outputs.name }}.zip" HEAD
          {
            echo "MD View ${{ steps.version.outputs.name }}"
            echo "Version code: ${{ steps.version.outputs.code }}"
            echo "Commit: $GITHUB_SHA"
            echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Minimum Android: 6.0 (API 23)"
            echo "Target Android API: 34"
            echo "Compile Android API: 36"
            echo "Signing certificate SHA-256: ${{ steps.release_key.outputs.certificate_sha256 }}"
            echo "Signing: persistent encrypted repository key + GitHub Actions secret"
          } > "$OUTPUT_DIR/build-info.txt"

      - name: Upload unsigned CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: MD-View-v${{ steps.version.outputs.name }}-unsigned
          path: artifact-unsigned/
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed updateable APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MD-View-v${{ steps.version.outputs.name }}-signed
          path: artifact-signed/
          if-no-files-found: error
          retention-days: 30

      - name: Require signed APK for manual release
        if: github.event_name == 'workflow_dispatch' && inputs.require_signed_apk && steps.signing.outputs.available != 'true'
        shell: bash
        run: |
          echo "Add the MD_VIEW_SIGNING_SECRET repository Actions secret, then rerun this workflow." >&2
          exit 1
