name: Android 6 runtime and scrolling smoke test

on:
  push:
    branches:
      - main
      - raw-webview-persistent-signing-v1.0.3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api23-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Open and scroll Raw and Rendered panes on Android 6
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: |
            printf '# Android 6 scrolling smoke test\n\n' > api23-smoke.md
            printf 'very-long-source-line-' >> api23-smoke.md
            head -c 1200 /dev/zero | tr '\0' 'x' >> api23-smoke.md
            printf '\n\n' >> api23-smoke.md
            seq 1 700 | sed 's/^/- rendered and raw line /' >> api23-smoke.md

            adb install -r app/build/outputs/apk/debug/app-debug.apk || exit 1
            adb push api23-smoke.md /data/local/tmp/api23-smoke.md || exit 1
            adb shell run-as dev.mdview.app mkdir -p files || exit 1
            adb shell run-as dev.mdview.app cp /data/local/tmp/api23-smoke.md files/api23-smoke.md || exit 1
            adb logcat -c || exit 1
            adb shell am force-stop dev.mdview.app || exit 1
            adb shell am start -W \
              -n dev.mdview.app/.MainActivity \
              -a android.intent.action.VIEW \
              -d file:///data/data/dev.mdview.app/files/api23-smoke.md \
              -t text/markdown || exit 1
            sleep 10

            adb shell uiautomator dump /sdcard/mdview-before.xml >/dev/null || exit 1
            adb pull /sdcard/mdview-before.xml api23-ui-before.xml >/dev/null || exit 1
            grep -q 'content-desc="Raw Markdown source"' api23-ui-before.xml || { cat api23-ui-before.xml; exit 1; }
            grep -q 'content-desc="Rendered Markdown preview"' api23-ui-before.xml || { cat api23-ui-before.xml; exit 1; }

            adb exec-out screencap -p > before-scroll.png || exit 1
            adb shell input swipe 720 1180 720 620 320 || exit 1
            sleep 2
            adb exec-out screencap -p > after-raw-vertical-scroll.png || exit 1
            test "$(sha256sum before-scroll.png | cut -d' ' -f1)" != \
                 "$(sha256sum after-raw-vertical-scroll.png | cut -d' ' -f1)" || exit 1

            adb shell input swipe 1120 760 260 760 320 || exit 1
            sleep 2
            adb exec-out screencap -p > after-raw-horizontal-scroll.png || exit 1
            test "$(sha256sum after-raw-vertical-scroll.png | cut -d' ' -f1)" != \
                 "$(sha256sum after-raw-horizontal-scroll.png | cut -d' ' -f1)" || exit 1

            adb shell input swipe 720 2280 720 1660 320 || exit 1
            sleep 2
            adb exec-out screencap -p > after-rendered-scroll.png || exit 1
            test "$(sha256sum after-raw-horizontal-scroll.png | cut -d' ' -f1)" != \
                 "$(sha256sum after-rendered-scroll.png | cut -d' ' -f1)" || exit 1

            adb logcat -d -v threadtime > api23-logcat.txt || exit 1
            adb shell uiautomator dump /sdcard/mdview-after.xml >/dev/null || exit 1
            adb pull /sdcard/mdview-after.xml api23-ui-after.xml >/dev/null || exit 1
            adb shell ps | grep -q 'dev.mdview.app' || { echo 'MD View process is not alive'; cat api23-logcat.txt; exit 1; }
            if grep -A80 -B3 'FATAL EXCEPTION' api23-logcat.txt | grep -q 'dev.mdview.app'; then cat api23-logcat.txt; exit 1; fi
            if grep -Eq 'NoClassDefFoundError.*java[./]util[./]function|java[./]util[./]function.*NoClassDefFoundError' api23-logcat.txt; then cat api23-logcat.txt; exit 1; fi
            if grep -q 'Unfortunately, MD View has stopped' api23-ui-after.xml; then cat api23-ui-after.xml; cat api23-logcat.txt; exit 1; fi
            echo 'Raw and Rendered both used WebView scrolling, accepted fling gestures, and stayed alive on Android 6.'

      - name: Upload runtime and scrolling evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api23-runtime-scrolling-evidence
          path: |
            api23-logcat.txt
            api23-ui-before.xml
            api23-ui-after.xml
            api23-smoke.md
            before-scroll.png
            after-raw-vertical-scroll.png
            after-raw-horizontal-scroll.png
            after-rendered-scroll.png
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
