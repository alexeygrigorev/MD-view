name: Android 6 runtime smoke test

on:
  push:
    branches:
      - fix-api23-crash-v1.0.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api23-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Reproduce current API 23 crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk || exit 1
            adb logcat -c || exit 1
            adb shell am force-stop dev.mdview.app || exit 1
            adb shell am start -W \
              -n dev.mdview.app/.MainActivity \
              -a android.intent.action.SEND \
              -t text/plain \
              --es android.intent.extra.TEXT "# Android 6 reproduction\n\n- raw\n- rendered" || exit 1
            sleep 4
            adb logcat -d -v threadtime > api23-logcat.txt || exit 1
            grep -E "FATAL EXCEPTION|NoClassDefFoundError|java[./]util[./]function" api23-logcat.txt > api23-crash-extract.txt || true
            cat api23-crash-extract.txt
            grep -Eq "NoClassDefFoundError.*java[./]util[./]function|java[./]util[./]function.*NoClassDefFoundError" api23-logcat.txt

      - name: Upload reproduction logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api23-reproduction-logs
          path: |
            api23-logcat.txt
            api23-crash-extract.txt
          if-no-files-found: warn
