name: "Apply Android 6 scrollbar crash fix"

on:
  push:
    branches:
      - fix-api23-crash-v1.0.2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix-api23-crash-v1.0.2
          fetch-depth: 0

      - name: Disable unsafe TextView scrollbar drawables
        shell: bash
        run: |
          set -euo pipefail
          FILE=app/src/main/java/dev/mdview/app/MainActivity.java
          sed -i 's/raw.setHorizontalScrollBarEnabled(true);/raw.setHorizontalScrollBarEnabled(false);/' "$FILE"
          sed -i 's/raw.setVerticalScrollBarEnabled(true);/raw.setVerticalScrollBarEnabled(false);/' "$FILE"
          sed -i '/raw.setScrollbarFadingEnabled(false);/d' "$FILE"
          sed -i 's/fallback.setVerticalScrollBarEnabled(true);/fallback.setVerticalScrollBarEnabled(false);/' "$FILE"
          sed -i '/fallback.setScrollbarFadingEnabled(false);/d' "$FILE"
          grep -q 'raw.setHorizontalScrollBarEnabled(false);' "$FILE"
          grep -q 'raw.setVerticalScrollBarEnabled(false);' "$FILE"
          grep -q 'fallback.setVerticalScrollBarEnabled(false);' "$FILE"
          ! grep -q 'setScrollbarFadingEnabled(false);' "$FILE"

      - name: Commit the correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Scrollbar correction is already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/dev/mdview/app/MainActivity.java
          git commit -m 'Prevent Android 6 null ScrollBarDrawable crash'
          git push origin HEAD:fix-api23-crash-v1.0.2
