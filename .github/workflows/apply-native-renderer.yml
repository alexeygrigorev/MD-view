name: Apply Android scrollbar crash fix

on:
  push:
    branches:
      - fix-native-renderer-v1.0.2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the fix branch
        uses: actions/checkout@v4
        with:
          ref: fix-native-renderer-v1.0.2
          fetch-depth: 0

      - name: Disable the crashing framework scrollbar path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/dev/mdview/app/MainActivity.java")
          source = path.read_text(encoding="utf-8")
          original = source

          source = source.replace(
              "raw.setVerticalScrollBarEnabled(true);",
              "raw.setVerticalScrollBarEnabled(false);"
          )
          source = source.replace(
              "raw.setScrollbarFadingEnabled(false);",
              "// Android 15 can dereference a null ScrollBarDrawable in software mode.\n"
              "        // Scrolling remains available through the movement method without the indicator."
          )
          source = source.replace(
              "fallback.setVerticalScrollBarEnabled(true);",
              "fallback.setVerticalScrollBarEnabled(false);"
          )
          source = source.replace(
              "fallback.setScrollbarFadingEnabled(false);",
              "// Keep native preview scrolling, but do not ask the framework to draw a scrollbar."
          )

          if source == original:
              print("The scrollbar crash correction is already applied.")
          else:
              path.write_text(source, encoding="utf-8")
          PY

          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/dev/mdview/app/MainActivity.java
          git commit -m "Disable TextView scrollbars that crash Android software drawing"
          git push origin HEAD:fix-native-renderer-v1.0.2
