name: Export Markdown test dependencies

on:
  push:
    branches:
      - diagnostics-deps
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the exact production parser jars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p exported
          base=https://repo1.maven.org/maven2/org/commonmark
          curl --fail --location --retry 3 "$base/commonmark/0.25.1/commonmark-0.25.1.jar" -o exported/commonmark-0.25.1.jar
          curl --fail --location --retry 3 "$base/commonmark-ext-gfm-tables/0.25.1/commonmark-ext-gfm-tables-0.25.1.jar" -o exported/commonmark-ext-gfm-tables-0.25.1.jar
          curl --fail --location --retry 3 "$base/commonmark-ext-gfm-strikethrough/0.25.1/commonmark-ext-gfm-strikethrough-0.25.1.jar" -o exported/commonmark-ext-gfm-strikethrough-0.25.1.jar
          sha256sum exported/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: commonmark-test-jars
          path: exported/*.jar
          if-no-files-found: error
