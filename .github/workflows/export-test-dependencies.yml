name: Export Markdown test dependencies

on:
  push:
    branches:
      - diagnostics-deps
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Resolve test dependencies
        run: gradle --no-daemon :app:dependencies --configuration testReleaseUnitTestRuntimeClasspath
      - name: Collect CommonMark jars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p exported
          find "$HOME/.gradle/caches/modules-2/files-2.1/org.commonmark" -type f -name '*.jar' -print -exec cp '{}' exported/ ';'
          ls -lah exported
          test "$(find exported -type f -name '*.jar' | wc -l)" -ge 3
      - uses: actions/upload-artifact@v4
        with:
          name: commonmark-test-jars
          path: exported/*.jar
          if-no-files-found: error
