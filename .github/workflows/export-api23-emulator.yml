name: Export Android 6 emulator bundle

on:
  push:
    branches:
      - diagnostics-emulator-sdk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Install Android 6 emulator components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "system-images;android-23;default;x86_64"
          echo no | avdmanager create avd --force -n mdview-api23 --package "system-images;android-23;default;x86_64" --device "Nexus 6"

      - name: Package only the runtime files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/sdk bundle/android-home
          cp -a "$ANDROID_HOME/emulator" bundle/sdk/
          cp -a "$ANDROID_HOME/platform-tools" bundle/sdk/
          mkdir -p bundle/sdk/system-images/android-23/default
          cp -a "$ANDROID_HOME/system-images/android-23/default/x86_64" bundle/sdk/system-images/android-23/default/
          cp -a "$HOME/.android/avd" bundle/android-home/
          cp -a "$HOME/.android/adbkey"* bundle/android-home/ 2>/dev/null || true
          du -sh bundle bundle/sdk/* bundle/sdk/system-images/android-23/default/x86_64
          tar --zstd -cf api23-emulator-runtime.tar.zst -C bundle .
          sha256sum api23-emulator-runtime.tar.zst > api23-emulator-runtime.sha256
          ls -lh api23-emulator-runtime.tar.zst

      - name: Upload emulator bundle
        uses: actions/upload-artifact@v4
        with:
          name: api23-emulator-runtime
          path: |
            api23-emulator-runtime.tar.zst
            api23-emulator-runtime.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
